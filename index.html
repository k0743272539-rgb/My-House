<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My House</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2a22;--mu:#6b7a70;--pr:#1f7a4d;--prt:#fff;--bd:#e2e6e0;--rd:#c0392b;--rdb:#fdecea;--gb:#e6f4ec;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--card:#1b231e;--tx:#e8efe9;--mu:#9aa89f;--pr:#3fb97c;--prt:#0c1a12;--bd:#2a352e;--rd:#ff8a7a;--rdb:#3a1f1c;--gb:#173325;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;padding:env(safe-area-inset-top,0) 0 100px}
header{padding:18px 16px 8px}
h1{margin:0 0 12px;font-size:22px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.stat small{color:var(--mu);display:block;font-size:12px}
.stat b{font-size:20px}
.stat.bad b{color:var(--rd)}
.search{padding:8px 16px}
input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.list{padding:4px 16px;display:grid;gap:10px}
.t{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.t .n{font-weight:600}
.t .s{color:var(--mu);font-size:13px;margin-top:2px}
.badge{padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--gb);color:var(--pr)}
.badge.d{background:var(--rdb);color:var(--rd)}
.empty{text-align:center;color:var(--mu);padding:40px 20px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--pr);color:var(--prt);border:0;border-radius:999px;padding:15px 22px;font:inherit;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 6px;font-size:20px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:90px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;text-align:center;text-decoration:none}
.btn.p{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.btn.r{color:var(--rd)}
.pay{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;gap:12px}
.kv span:first-child{color:var(--mu)}
.sm{font-size:12px;color:var(--mu);text-align:center;margin:18px 16px}
.sm a{color:var(--pr)}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#login>div{width:100%;max-width:340px;text-align:center}
.err{color:var(--rd);font-size:14px;margin-top:10px;min-height:20px}
#app{display:none}
</style>
</head>
<body>
<div id="login"><div>
<div style="font-size:46px">🏠</div>
<h2 id="lt" style="margin:8px 0">Ingia</h2>
<p style="color:var(--mu);font-size:14px;margin:0 0 10px">My House</p>
<input id="em" type="email" placeholder="Email" autocomplete="username" style="margin-bottom:8px">
<input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<div class="row"><button class="btn p" id="lb" onclick="doAuth()">Ingia</button></div>
<div class="err" id="er"></div>
<div class="sm" style="margin:6px 0"><a href="#" id="sw" onclick="setMode();return false">Huna akaunti? Tengeneza</a> · <a href="#" onclick="resetPw();return false">Nimesahau password</a></div>
</div></div>

<div id="app">
<header>
<h1>🏠 My House</h1>
<div class="stats">
<div class="stat"><small>Wapangaji</small><b id="cnt">0</b></div>
<div class="stat bad"><small>Kiasi kilichobaki jumla (TSh)</small><b id="debt">0</b></div>
</div>
</header>
<div class="search"><input id="q" placeholder="Tafuta jina au chumba..." oninput="render()"></div>
<div class="list" id="list"></div>
<div class="sm" id="who"></div>
<div class="sm" style="margin-top:0"><a href="#" onclick="logout();return false">Toka (Logout)</a></div>
<button class="fab" onclick="openForm()">+ Mpangaji</button>
<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyC5Kt0qRXJRaEPhvmSigTTC8xAeCjJy4EU",
  authDomain:"my-house-bba7b.firebaseapp.com",
  projectId:"my-house-bba7b",
  storageBucket:"my-house-bba7b.firebasestorage.app",
  messagingSenderId:"1099445202835",
  appId:"1:1099445202835:web:90981dee6173e3135a0266"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US');
const months=t=>+t.months||0, paid=t=>+t.paid||0, debt=t=>months(t)*(+t.rent||0)-paid(t);
const find=id=>data.find(t=>t.id===id);
let uid=null,data=[],unsub=null,reg=false;

const ERR={'auth/invalid-credential':'Email au password si sahihi.','auth/wrong-password':'Password si sahihi.','auth/user-not-found':'Akaunti hii haipo.','auth/email-already-in-use':'Email hii tayari ina akaunti. Bonyeza Ingia.','auth/weak-password':'Password iwe angalau herufi 6.','auth/invalid-email':'Email si sahihi.','auth/network-request-failed':'Hakuna mtandao.','auth/operation-not-allowed':'Email/Password haijawashwa kwenye Firebase.','auth/api-key-not-valid.-please-pass-a-valid-api-key.':'apiKey si sahihi.','auth/unauthorized-domain':'Domain hii haijaruhusiwa kwenye Firebase (Authorized domains).','auth/too-many-requests':'Majaribio mengi. Subiri kidogo.'};
const msg=e=>ERR[e.code]||('Hitilafu: '+(e.code||e.message));

onAuthStateChanged(auth,u=>{
  if(u){
    uid=u.uid;$('login').style.display='none';$('app').style.display='block';$('who').textContent=u.email;
    if(unsub)unsub();
    unsub=onSnapshot(collection(db,'users/'+uid+'/tenants'),s=>{data=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));data.sort((a,b)=>(a.name||'').localeCompare(b.name||''));render()},e=>{alert(msg(e))});
  }else{
    uid=null;if(unsub){unsub();unsub=null}data=[];$('app').style.display='none';$('login').style.display='flex';$('pw').value='';
  }
});

function setMode(){reg=!reg;$('lt').textContent=reg?'Tengeneza akaunti':'Ingia';$('lb').textContent=reg?'Tengeneza akaunti':'Ingia';$('sw').textContent=reg?'Una akaunti? Ingia':'Huna akaunti? Tengeneza';$('pw').autocomplete=reg?'new-password':'current-password';$('er').textContent=''}
async function doAuth(){
  const e=$('em').value.trim(),p=$('pw').value;$('er').textContent='';
  if(!e||!p){$('er').textContent='Weka email na password.';return}
  try{reg?await createUserWithEmailAndPassword(auth,e,p):await signInWithEmailAndPassword(auth,e,p)}catch(x){$('er').textContent=msg(x)}
}
async function resetPw(){
  const e=$('em').value.trim();if(!e){$('er').textContent='Andika email yako kwanza.';return}
  try{await sendPasswordResetEmail(auth,e);$('er').style.color='var(--pr)';$('er').textContent='Link ya kubadili password imetumwa kwenye email yako.'}catch(x){$('er').style.color='';$('er').textContent=msg(x)}
}
function logout(){if(confirm('Unataka kutoka?'))signOut(auth)}

function render(){
  const q=$('q').value.toLowerCase();let tot=0;
  data.forEach(t=>{const d=debt(t);if(d>0)tot+=d});
  $('cnt').textContent=data.length;$('debt').textContent=fmt(tot);
  const l=data.filter(t=>((t.name||'')+' '+(t.room||'')).toLowerCase().includes(q));
  $('list').innerHTML=l.length?l.map(t=>{const d=debt(t);
    const b=d>0?'<span class="badge d">Baki '+fmt(d)+'</span>':'<span class="badge">'+(d<0?'Mbele '+fmt(-d):'Amelipa ✓')+'</span>';
    return '<div class="t" onclick="openDetail(\''+t.id+'\')"><div><div class="n">'+esc(t.name)+'</div><div class="s">Chumba '+esc(t.room)+' · TSh '+fmt(+t.rent||0)+'/mwezi</div></div>'+b+'</div>'}).join(''):'<div class="empty">Hakuna mpangaji bado.<br>Bonyeza “+ Mpangaji” kuongeza.</div>';
}
function openSheet(h){$('sheet').innerHTML=h;$('ov').classList.add('on')}
function closeSheet(){$('ov').classList.remove('on')}
function endOf(s,m){const d=new Date(s);if(isNaN(d))return '';d.setMonth(d.getMonth()+(+m||0));const p=x=>(x<10?'0':'')+x;return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function calc(auto){
  const v=id=>$(id).value;
  $('f_b').textContent='TSh '+fmt(Math.max(0,(+v('f_k')||0)*(+v('f_m')||0)-(+v('f_a')||0)));
  if(auto){const e=endOf(v('f_s'),v('f_m'));if(e)$('f_e').value=e}
}
function openForm(id){
  const t=id?find(id):{name:'',phone:'',room:'',rent:'',paid:'',months:'',start:new Date().toISOString().slice(0,10),end:'',notes:''};
  openSheet('<h2>'+(id?'Hariri mpangaji':'Mpangaji mpya')+'</h2>'+
  '<label>Jina</label><input id="f_n" value="'+esc(t.name)+'">'+
  '<label>Namba ya simu</label><input id="f_p" type="tel" value="'+esc(t.phone)+'">'+
  '<label>Chumba (namba au jina)</label><input id="f_r" value="'+esc(t.room)+'">'+
  '<label>Kodi kwa mwezi (TSh)</label><input id="f_k" type="number" inputmode="numeric" oninput="calc()" value="'+esc(t.rent)+'">'+
  '<label>Kiasi alicholipa (TSh)</label><input id="f_a" type="number" inputmode="numeric" oninput="calc()" value="'+esc(t.paid)+'">'+
  '<label>Kiasi kilichobaki (hesabu otomatiki)</label><div id="f_b" style="padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-weight:700;color:var(--rd)">TSh '+fmt(Math.max(0,(+t.months||0)*(+t.rent||0)-(+t.paid||0)))+'</div>'+
  '<label>Miezi mingapi amepanga</label><input id="f_m" type="number" inputmode="numeric" oninput="calc(1)" value="'+esc(t.months)+'">'+
  '<label>Tarehe ya kuanza</label><input id="f_s" type="date" oninput="calc(1)" value="'+esc(t.start)+'">'+
  '<label>Tarehe ya kumaliza</label><input id="f_e" type="date" value="'+esc(t.end)+'">'+
  '<label>Maelezo (si lazima)</label><textarea id="f_o" rows="2">'+esc(t.notes)+'</textarea>'+
  '<div class="row"><button class="btn" onclick="closeSheet()">Ghairi</button><button class="btn p" onclick="saveTenant(\''+(id||'')+'\')">Hifadhi</button></div>');
}
function put(t){setDoc(doc(db,'users/'+uid+'/tenants/'+t.id),t).catch(e=>alert(msg(e)))}
function saveTenant(id){
  const n=$('f_n').value.trim(),k=parseFloat($('f_k').value);
  if(!n||!(k>=0)){alert('Weka jina na kodi.');return}
  const old=id?find(id):null;
  const o={id:id||String(Date.now()),name:n,phone:$('f_p').value.trim(),room:$('f_r').value.trim(),rent:k,paid:+$('f_a').value||0,months:+$('f_m').value||0,start:$('f_s').value,end:$('f_e').value,notes:$('f_o').value.trim(),pays:old?(old.pays||[]):[]};
  put(o);closeSheet();
}
function smsLink(t){const d=debt(t);const m='Habari '+t.name+', kuhusu kodi ya chumba '+t.room+': umelipa TSh '+fmt(paid(t))+(d>0?', kiasi kilichobaki ni TSh '+fmt(d)+'. Tafadhali lipa. Asante.':'. Asante kwa malipo yako.');return 'sms:'+String(t.phone).replace(/\s/g,'')+'?&body='+encodeURIComponent(m)}
function openDetail(id){
  const t=find(id);if(!t)return;const d=debt(t);
  const pays=(t.pays||[]).slice().sort((a,b)=>a.d<b.d?1:-1).map(p=>'<div class="pay"><span>'+esc(p.d)+(p.m?' · '+esc(p.m):'')+'</span><b>TSh '+fmt(p.a)+'</b></div>').join('')||'<div style="color:var(--mu);padding:8px 0;font-size:14px">Hakuna malipo yaliyorekodiwa bado.</div>';
  openSheet('<h2>'+esc(t.name)+'</h2>'+
  '<div class="kv"><span>Chumba</span><span>'+esc(t.room)+'</span></div>'+
  '<div class="kv"><span>Simu</span><span>'+esc(t.phone||'-')+'</span></div>'+
  '<div class="kv"><span>Kodi/mwezi</span><span>TSh '+fmt(+t.rent||0)+'</span></div>'+
  '<div class="kv"><span>Miezi aliyopanga</span><span>'+months(t)+'</span></div>'+
  '<div class="kv"><span>Tarehe ya kuanza</span><span>'+esc(t.start||'-')+'</span></div>'+
  '<div class="kv"><span>Tarehe ya kumaliza</span><span>'+esc(t.end||'-')+'</span></div>'+
  '<div class="kv"><span>Kiasi alicholipa</span><span>TSh '+fmt(paid(t))+'</span></div>'+
  '<div class="kv"><span>'+(d>0?'Kiasi kilichobaki':'Amelipa zaidi')+'</span><b style="color:'+(d>0?'var(--rd)':'var(--pr)')+'">TSh '+fmt(Math.abs(d))+'</b></div>'+
  (t.notes?'<div class="kv"><span>Maelezo</span><span>'+esc(t.notes)+'</span></div>':'')+
  '<label>Ongeza malipo (TSh)</label><input id="pa" type="number" inputmode="numeric" placeholder="mfano 50000">'+
  '<label>Mwezi unaolipiwa (si lazima)</label><input id="pm" placeholder="mfano Novemba">'+
  '<div class="row"><button class="btn p" onclick="addPay(\''+id+'\')">Hifadhi malipo</button></div>'+
  '<h3 style="margin:18px 0 4px;font-size:16px">Historia ya malipo</h3>'+pays+
  '<div class="row">'+(t.phone?'<a class="btn" href="tel:'+esc(t.phone)+'">📞 Piga</a><a class="btn" href="'+esc(smsLink(t))+'">💬 SMS</a>':'')+'<button class="btn" onclick="openForm(\''+id+'\')">Hariri</button><button class="btn r" onclick="del(\''+id+'\')">Futa</button></div>'+
  '<div class="row"><button class="btn" onclick="closeSheet()">Funga</button></div>');
}
function addPay(id){
  const a=parseFloat($('pa').value);if(!(a>0)){alert('Weka kiasi sahihi.');return}
  const t=find(id);
  t.paid=(+t.paid||0)+a;t.pays=(t.pays||[]).concat([{d:new Date().toISOString().slice(0,10),a:a,m:$('pm').value.trim()}]);
  put(t);render();openDetail(id);
}
function del(id){
  if(!confirm('Futa mpangaji huyu na malipo yake yote?'))return;
  deleteDoc(doc(db,'users/'+uid+'/tenants/'+id)).catch(e=>alert(msg(e)));closeSheet();
}
Object.assign(window,{setMode,doAuth,resetPw,logout,render,openForm,calc,saveTenant,openDetail,addPay,del,closeSheet});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
